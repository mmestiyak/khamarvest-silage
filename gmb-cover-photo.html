<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>খামারভেস্ট সাইলেজ - Google My Business Cover Photo (1200x500)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .cover-container {
      width: 1200px;
      height: 500px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    /* Background gradient with agricultural theme */
    .background {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0b5b38 0%, #075a35 50%, #053d28 100%);
      position: relative;
    }
    /* Decorative silage bag silhouette on right */
    .silage-bag {
      position: absolute;
      right: -50px;
      top: -100px;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      transform: rotate(-15deg);
    }
    /* Content area */
    .content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 60px;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
    }
    .tagline {
      color: #b8e5c8;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0 0 15px 0;
    }
    .main-heading {
      color: #ffffff;
      font-size: 56px;
      font-weight: bold;
      line-height: 1.2;
      margin: 0 0 20px 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    .subheading {
      color: #e1f5e6;
      font-size: 22px;
      line-height: 1.4;
      margin: 0 0 30px 0;
      max-width: 500px;
      font-weight: 500;
    }
    .features {
      display: flex;
      gap: 40px;
      margin-top: 25px;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .feature-icon {
      font-size: 28px;
    }
    .feature-text {
      color: #b8e5c8;
      font-size: 15px;
      font-weight: 600;
    }
    /* Accent bar */
    .accent-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #1877F2 0%, #0e7c4b 50%, #1877F2 100%);
    }
  </style>
</head>
<body>

<div class="cover-container">
  <div class="background">
    <div class="silage-bag"></div>

    <div class="content">
      <div class="tagline">খামারভেস্ট সাইলেজ</div>
      <!-- OPTION 1: Benefits Focus -->
      <div class="main-heading">দুধ বাড়ান<br>খরচ বাঁচান</div>
      <div class="subheading">খাঁটি সাইলেজ, সারাদেশে দ্রুত ডেলিভারি</div>

      <!-- OPTION 2: Quality Focus (Commented out - uncomment to use)
      <div class="main-heading">খাঁটি সাইলেজ<br>সারাদেশে</div>
      <div class="subheading">সব ধরনের পশুর জন্য কোয়ালিটি খাবার নিশ্চিত</div>
      -->

      <!-- OPTION 3: Year-round Focus (Commented out - uncomment to use)
      <div class="main-heading">সারা বছর<br>সবুজ খাবার</div>
      <div class="subheading">শীত-গ্রীষ্ম সবসময় কোয়ালিটি সাইলেজ পান</div>
      -->

      <div class="features">
        <div class="feature">
          <div class="feature-icon">✓</div>
          <div class="feature-text">সরাসরি সরবরাহ</div>
        </div>
        <div class="feature">
          <div class="feature-icon">✓</div>
          <div class="feature-text">বিশ্বস্ত ব্র্যান্ড</div>
        </div>
        <div class="feature">
          <div class="feature-icon">📱</div>
          <div class="feature-text">WhatsApp অর্ডার</div>
        </div>
      </div>
    </div>
  </div>

  <div class="accent-bar"></div>
</div>

<script>
  // Allow download as image
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    const canvas = document.querySelector('.cover-container');
    html2canvas(canvas, {
      backgroundColor: '#f0f0f0',
      scale: 2
    }).then(canv => {
      const link = document.createElement('a');
      link.href = canv.toDataURL('image/png');
      link.download = 'khamarvest-gmb-cover-1200x500.png';
      link.click();
    });
  });
</script>

<!-- Alternative: Simple export instruction -->
<div style="position: absolute; bottom: 20px; right: 20px; background: white; padding: 15px 20px; border-radius: 8px; font-size: 12px; color: #333; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 10;">
  <strong>কীভাবে ডাউনলোড করবেন:</strong><br>
  ১. এই পাতায় রাইট-ক্লিক করুন<br>
  ২. "Screenshot" নিন (Chrome DevTools)<br>
  অথবা নিচের লিংক ব্যবহার করুন
</div>

</body>
</html>
