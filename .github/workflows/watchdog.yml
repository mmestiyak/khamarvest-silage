# Daily check of the LIVE site. `npm run check` validates the repo; this
# validates what Cloudflare is actually serving, which is where a broken deploy,
# an expired price offer or a lapsed HTTPS redirect would show up instead.
# Opens or updates one GitHub issue when something is wrong.
name: Live site watchdog

on:
  schedule:
    - cron: '0 2 * * *'   # daily, 02:00 UTC (08:00 Dhaka)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Watch the live site
        id: watch
        run: |
          set +e
          node scripts/watch-site.mjs > report.md
          echo "failed=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Open or update the issue
        if: steps.watch.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
        run: |
          TITLE="Live site watchdog found a problem"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file report.md
          else
            URL=$(gh issue create --title "$TITLE" --body-file report.md)
            # A new problem (state change): tell Telegram through the Apps Script relay.
            if [ -n "$ALERT_KEY" ]; then
              LEADS_URL=$(grep -o "LEADS_URL = '[^']*'" js/leads.js | cut -d"'" -f2)
              jq -n --arg key "$ALERT_KEY" --arg title "$TITLE" --arg body "$(head -c 1400 report.md)" --arg url "$URL" \
                '{form_type:"site_alert", key:$key, title:$title, body:$body, url:$url, resolved:false}' \
                | curl -sS -o /dev/null -X POST -H 'Content-Type: text/plain;charset=utf-8' --data-binary @- "$LEADS_URL" || true
            fi
          fi

      - name: Close the issue once the site is healthy again
        if: steps.watch.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
        run: |
          TITLE="Live site watchdog found a problem"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Watchdog is green again as of $(date -u +%F). Closing."
            gh issue close "$EXISTING"
            # Problem gone (state change): tell Telegram through the Apps Script relay.
            if [ -n "$ALERT_KEY" ]; then
              LEADS_URL=$(grep -o "LEADS_URL = '[^']*'" js/leads.js | cut -d"'" -f2)
              jq -n --arg key "$ALERT_KEY" --arg title "Live site watchdog: সব ঠিক আছে" \
                '{form_type:"site_alert", key:$key, title:$title, resolved:true}' \
                | curl -sS -o /dev/null -X POST -H 'Content-Type: text/plain;charset=utf-8' --data-binary @- "$LEADS_URL" || true
            fi
          fi
