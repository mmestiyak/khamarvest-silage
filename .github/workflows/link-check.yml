# Monthly check that every cited source (DAERA, Teagasc, LSU, ...) still
# resolves. Opens or updates one GitHub issue listing the dead links.
name: External link check

on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of every month, 03:00 UTC (09:00 Dhaka)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check links
        id: links
        run: |
          set +e
          node scripts/check-external-links.mjs > report.md
          echo "failed=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Open or update the issue
        if: steps.links.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Dead source links found by the monthly link check"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file report.md
          else
            gh issue create --title "$TITLE" --label "content" --body-file report.md || gh issue create --title "$TITLE" --body-file report.md
          fi
