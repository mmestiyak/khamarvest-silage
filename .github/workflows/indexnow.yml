# Tells Bing (and through IndexNow: Yandex, Naver, Seznam) which pages changed
# on every deploy. Bing's index feeds ChatGPT search, our main referral source.
# Google does not support IndexNow; it discovers changes through sitemap.xml.
name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'llms.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cloudflare deploys from the same push. Give it time so Bing's first
      # fetch of a brand-new URL does not see a 404.
      - name: Wait for the Cloudflare deploy to land
        run: sleep 240

      # Retry for a few minutes instead of failing on one slow deploy: a
      # missed ping here means this push's pages just wait for Bing's normal
      # crawl instead of getting the fast-track submission.
      - name: Verify the key file is live
        run: |
          KEY=$(grep -o "INDEXNOW_KEY = '[a-f0-9]*'" scripts/indexnow.mjs | cut -d"'" -f2)
          for i in 1 2 3 4 5; do
            if curl -sf "https://silage.khamarvest.com/$KEY.txt" | grep -q "$KEY"; then
              echo "Key file is live."; exit 0
            fi
            echo "Attempt $i: key file not live yet, waiting 60s..."
            sleep 60
          done
          echo "Key file never came up, skipping this push's IndexNow submission."
          exit 1

      - name: Submit changed URLs
        run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
